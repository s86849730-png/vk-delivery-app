<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoSHtavKa — Доставка</title>

    <!-- VK Bridge -->
    <script src="https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@latest/dist/browser.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; padding: 16px; background: #f5f7fa; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        h1 { text-align: center; color: #333; }
        .menu-item {
            background: white;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-item button {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .cart {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .cart input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .cart button {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .cart .btn-secondary {
            background: #6c5ce7;
            margin-top: 8px;
        }
        .cart .btn-orders {
            background: #e17055;
            margin-top: 8px;
        }
        .status-text { text-align: center; margin-top: 10px; font-size: 14px; color: #555; }
        .loading { text-align: center; font-size: 18px; padding: 40px; color: #888; }
        .hidden { display: none; }
        .orders-list {
            margin-top: 10px;
            font-size: 14px;
            color: #333;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
        }
        .orders-list .order-item {
            padding: 6px 0;
            border-bottom: 1px solid #eee;
        }
        .orders-list .order-item:last-child { border-bottom: none; }
        .orders-list .active-section { border-left: 3px solid #fdcb6e; padding-left: 10px; margin-bottom: 8px; }
        .orders-list .completed-section { border-left: 3px solid #00b894; padding-left: 10px; }
        .orders-list .empty-msg { color: #888; text-align: center; padding: 12px 0; }
    </style>
</head>
<body>

    <div id="loading" class="loading">⏳ Загрузка...</div>

    <div id="app" class="container hidden">
        <h1>🚀 DoSHtavKa</h1>
        <p style="text-align:center; color:#555;">Доставка из Бородино</p>

        <div id="menu">
            <div class="menu-item">
                <span>Маргарита — 450₽</span>
                <button onclick="addToCart('Маргарита — 450₽')">+</button>
            </div>
            <div class="menu-item">
                <span>Пепперони — 550₽</span>
                <button onclick="addToCart('Пепперони — 550₽')">+</button>
            </div>
            <div class="menu-item">
                <span>Сырная — 500₽</span>
                <button onclick="addToCart('Сырная — 500₽')">+</button>
            </div>
        </div>

        <div class="cart">
            <h3>🛒 Корзина</h3>
            <div id="cart-items">Товаров: 0</div>
            <input type="text" id="address" placeholder="📍 Адрес доставки">
            <input type="tel" id="phone" placeholder="📞 Телефон для связи">
            <button onclick="sendOrder()">✅ Оформить заказ</button>
            <button onclick="checkStatus()" class="btn-secondary">📋 Узнать статус последнего заказа</button>
            <button onclick="getOrders()" class="btn-orders">📋 Мои заказы</button>
            <div id="status" class="status-text"></div>
            <div id="orders-list" class="orders-list hidden">
                <div class="empty-msg">Нажмите «Мои заказы», чтобы увидеть список</div>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let userId = 123456789; // позже подставим реальный ID из VK

        function addToCart(item) {
            cart.push(item);
            document.getElementById('cart-items').innerText = 'Товаров: ' + cart.length;
        }

        async function sendOrder() {
            const address = document.getElementById('address').value;
            const phone = document.getElementById('phone').value;
            if (cart.length === 0) {
                document.getElementById('status').innerText = '❌ Выберите товар';
                return;
            }
            if (!address) {
                document.getElementById('status').innerText = '❌ Введите адрес';
                return;
            }
            if (!phone) {
                document.getElementById('status').innerText = '❌ Введите телефон';
                return;
            }

            const payload = {
                user_id: userId,
                username: 'vk_user',
                item: cart.join(', '),
                address: address,
                phone: phone,
                source: 'vk'
            };

            try {
                const response = await fetch('https://accessory-pound-ada-produced.trycloudflare.com/api/vk_order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    document.getElementById('status').innerText = '✅ Заказ оформлен!';
                    cart = [];
                    document.getElementById('cart-items').innerText = 'Товаров: 0';
                    document.getElementById('address').value = '';
                    document.getElementById('phone').value = '';
                    getOrders(); // обновляем список заказов
                } else {
                    document.getElementById('status').innerText = '❌ Ошибка при оформлении';
                }
            } catch (e) {
                document.getElementById('status').innerText = '❌ Ошибка соединения';
            }
        }

        async function checkStatus() {
            try {
                const response = await fetch(`https://accessory-pound-ada-produced.trycloudflare.com/api/order_status/${userId}`);
                const data = await response.json();
                document.getElementById('status').innerText = `📦 Статус последнего заказа: ${data.status}`;
            } catch (e) {
                document.getElementById('status').innerText = '❌ Ошибка получения статуса';
            }
        }

        async function getOrders() {
            const list = document.getElementById('orders-list');
            try {
                const response = await fetch(`https://accessory-pound-ada-produced.trycloudflare.com/api/user_orders/${userId}`);
                const data = await response.json();
                list.classList.remove('hidden');
                if (data.orders && data.orders.length > 0) {
                    // Разделяем на активные и завершённые
                    const active = data.orders.filter(o => 
                        o.status !== '✅ Доставлен' && o.status !== '❌ Отменён'
                    );
                    const completed = data.orders.filter(o => 
                        o.status === '✅ Доставлен' || o.status === '❌ Отменён'
                    );
                    
                    let html = '';
                    if (active.length > 0) {
                        html += `<div class="active-section"><b>🟡 Активные заказы (${active.length}):</b><br>`;
                        active.forEach((o, i) => {
                            const status = o.status || '🟡 Ожидает';
                            html += `<div class="order-item">${i+1}. ${o.item} — ${status}</div>`;
                        });
                        html += `</div>`;
                    }
                    if (completed.length > 0) {
                        html += `<div class="completed-section"><b>✅ Завершённые (${completed.length}):</b><br>`;
                        completed.forEach((o, i) => {
                            const status = o.status || '✅ Доставлен';
                            html += `<div class="order-item">${i+1}. ${o.item} — ${status}</div>`;
                        });
                        html += `</div>`;
                    }
                    if (active.length === 0 && completed.length === 0) {
                        html = '<div class="empty-msg">У вас пока нет заказов</div>';
                    }
                    list.innerHTML = html;
                } else {
                    list.innerHTML = '<div class="empty-msg">У вас пока нет заказов</div>';
                }
            } catch (e) {
                list.innerHTML = '<div class="empty-msg">❌ Ошибка загрузки заказов</div>';
            }
        }

        // VK Bridge инициализация
        if (typeof vkBridge !== 'undefined') {
            vkBridge.send('VKWebAppInit', {})
                .then(() => {
                    console.log('✅ VKAppInit OK');
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');
                    // Автоматически показываем заказы
                    getOrders();
                })
                .catch(e => console.error('❌ Init error', e));
        }
    </script>
</body>
</html>
