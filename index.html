<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoSHtavKa — Доставка</title>
    <script src="https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@latest/dist/browser.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 16px; background: #f5f7fa; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        h1 { text-align: center; color: #333; }
        .menu-item {
            background: white;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-item button {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .cart {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .cart input, .cart textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .cart button {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .cart .btn-secondary { background: #6c5ce7; margin-top: 8px; }
        .cart .btn-orders { background: #e17055; margin-top: 8px; }
        .cart .btn-support { background: #fdcb6e; margin-top: 8px; color: #333; }
        .cart .btn-refresh { background: #00b894; margin-top: 8px; }
        .status-text { text-align: center; margin-top: 10px; font-size: 14px; color: #555; }
        .loading { text-align: center; font-size: 18px; padding: 40px; color: #888; }
        .hidden { display: none; }
        .orders-list {
            margin-top: 10px;
            font-size: 14px;
            color: #333;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
        }
        .orders-list .order-item { padding: 6px 0; border-bottom: 1px solid #eee; }
        .orders-list .order-item:last-child { border-bottom: none; }
        .orders-list .active-section { border-left: 3px solid #fdcb6e; padding-left: 10px; margin-bottom: 8px; }
        .orders-list .completed-section { border-left: 3px solid #00b894; padding-left: 10px; }
        .orders-list .empty-msg { color: #888; text-align: center; padding: 12px 0; }
        .cart-items-detail { font-size: 14px; color: #555; margin: 6px 0; }
        .cart-items-detail .shop-name { font-weight: bold; color: #333; }
        .cart-item-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
        .cart-item-row .remove-btn { background: #e74c3c; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; }
        .support-form { margin-top: 10px; }
        .support-form textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; box-sizing: border-box; }
        .support-form button { margin-top: 8px; }
        .cart-total { font-weight: bold; margin-top: 8px; color: #333; }
        .delivery-fee { color: #666; font-size: 13px; margin-top: 4px; }
        .weight-warning { color: #e74c3c; font-weight: bold; margin-top: 6px; }
        .item-weight { font-size: 12px; color: #888; }
        .completed-section .order-item { font-size: 13px; }
    </style>
</head>
<body>
    <div id="loading" class="loading">⏳ Загрузка...</div>
    <div id="app" class="container hidden">
        <h1>🚀 DoSHtavKa</h1>
        <p style="text-align:center; color:#555;">Доставка из Бородино</p>
        <div id="menu"></div>
        <div class="cart">
            <h3>🛒 Корзина</h3>
            <div id="cart-items">Товаров: 0</div>
            <div id="cart-details" class="cart-items-detail"></div>
            <div id="cart-total" class="cart-total">💰 Итого: 0 ₽</div>
            <div id="delivery-fee" class="delivery-fee">🚚 Доставка: 150 ₽</div>
            <div id="weight-display" class="weight-warning" style="display:none;"></div>
            <input type="text" id="address" placeholder="📍 Адрес доставки">
            <input type="tel" id="phone" placeholder="📞 Телефон для связи">
            <textarea id="order-comment" rows="2" placeholder="📝 Комментарий к заказу (необязательно)"></textarea>
            <div style="margin: 10px 0; font-size: 14px;">
    <label>
        <input type="checkbox" id="consentCheckbox">
        Я согласен на обработку персональных данных в соответствии с
        <a href="https://s86849730-png.github.io/vk-delivery-app/privacy.html" target="_blank" style="color:#667eea;">
            политикой конфиденциальности
        </a>
    </label>
</div>
            <button onclick="sendOrder()">✅ Оформить заказ</button>
            <button onclick="checkStatus()" class="btn-secondary">📋 Узнать статус последнего заказа</button>
            <button onclick="getOrders()" class="btn-orders">📋 Мои заказы</button>
            <button onclick="refreshOrders()" class="btn-refresh">🔄 Обновить</button>
            <button onclick="showSupport()" class="btn-support">🆘 Поддержка</button>
            <div id="status" class="status-text"></div>
            <div id="support-form" class="support-form hidden">
                <textarea id="support-message" rows="3" placeholder="Опишите вашу проблему..."></textarea>
                <button onclick="sendSupport()">📤 Отправить</button>
                <button onclick="hideSupport()" class="btn-secondary">❌ Отмена</button>
            </div>
            <div id="orders-list" class="orders-list hidden"><div class="empty-msg">Нажмите «Мои заказы», чтобы увидеть список</div></div>
        </div>
    </div>
    <script>
        const API_BASE = 'https://accessory-pound-ada-produced.trycloudflare.com';
        let cart = [];
        let userId = 123456789;
        let shopsData = null;

        async function loadShops() {
            try {
                const res = await fetch(`${API_BASE}/api/shops`);
                shopsData = await res.json();
                const menu = document.getElementById('menu');
                menu.innerHTML = '';
                if (shopsData.shops && shopsData.shops.length > 0) {
                    shopsData.shops.forEach(shop => {
                        const shopTitle = document.createElement('div');
                        shopTitle.style.cssText = 'font-weight:bold; margin:12px 0 6px; color:#333;';
                        shopTitle.innerText = '🏪 ' + shop.name;
                        menu.appendChild(shopTitle);
                        shop.items.forEach(item => {
                            const weight = item.weight || 0;
                            const div = document.createElement('div');
                            div.className = 'menu-item';
                            div.innerHTML = `
                                <span>${item.name} — ${item.price}₽ <span class="item-weight">(${weight} кг)</span></span>
                                <button onclick="addToCart('${shop.name}', '${item.name} — ${item.price}', ${weight})">+</button>
                            `;
                            menu.appendChild(div);
                        });
                    });
                } else {
                    menu.innerHTML = '<p style="text-align:center;color:#888;">Меню пока пусто. Загляните позже!</p>';
                }
            } catch (e) {
                document.getElementById('menu').innerHTML = '<p style="text-align:center;color:#e74c3c;">❌ Ошибка загрузки меню</p>';
            }
        }

        function addToCart(shop, item, weight) {
            cart.push({ shop, name: item, weight: weight || 0 });
            updateCartDisplay();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartDisplay();
        }

        function updateCartDisplay() {
            document.getElementById('cart-items').innerText = 'Товаров: ' + cart.length;
            const details = document.getElementById('cart-details');
            const totalElem = document.getElementById('cart-total');
            const feeElem = document.getElementById('delivery-fee');
            const weightElem = document.getElementById('weight-display');
            
            if (cart.length === 0) {
                details.innerHTML = '';
                totalElem.innerText = '💰 Итого: 0 ₽';
                feeElem.innerText = '🚚 Доставка: 0 ₽';
                weightElem.style.display = 'none';
                return;
            }
            
            const grouped = {};
            let total = 0;
            let totalWeight = 0;
            cart.forEach((item, idx) => {
                const priceMatch = item.name.match(/(\d+)/);
                const price = priceMatch ? parseInt(priceMatch[0]) : 0;
                total += price;
                totalWeight += item.weight;
                const key = item.shop + '|||' + item.name;
                if (!grouped[key]) {
                    grouped[key] = {
                        shop: item.shop,
                        name: item.name,
                        count: 0,
                        price: price,
                        weight: item.weight,
                        indices: []
                    };
                }
                grouped[key].count += 1;
                grouped[key].indices.push(idx);
            });
            
            let html = '';
            let itemIndex = 0;
            for (const key in grouped) {
                const item = grouped[key];
                const subtotal = item.price * item.count;
                html += `<div class="cart-item-row">
                    <span><span class="shop-name">${item.shop}</span>: ${item.name} x${item.count} = ${subtotal} ₽ (${item.weight * item.count} кг)</span>
                    <button class="remove-btn" onclick="removeFromCart(${itemIndex})">✕</button>
                </div>`;
                itemIndex++;
            }
            details.innerHTML = html;
            totalElem.innerText = `💰 Итого: ${total + 150} ₽ (вкл. доставку 150 ₽)`;
            feeElem.innerText = `🚚 Доставка: 150 ₽`;
            
            if (totalWeight > 20) {
                weightElem.style.display = 'block';
                weightElem.innerText = `⚠️ Суммарный вес (${totalWeight.toFixed(1)} кг) превышает 20 кг! Уберите лишние товары.`;
                weightElem.style.color = '#e74c3c';
            } else {
                weightElem.style.display = 'block';
                weightElem.innerText = `⚖️ Общий вес: ${totalWeight.toFixed(1)} кг (максимум 20 кг)`;
                weightElem.style.color = '#2ecc71';
            }
        }

        async function sendOrder() {
            const address = document.getElementById('address').value;
            const phone = document.getElementById('phone').value;
            const comment = document.getElementById('order-comment').value;
            
            const consent = document.getElementById('consentCheckbox').checked;
            if (!consent) {
                document.getElementById('status').innerText = '❌ Необходимо дать согласие на обработку данных.';
                return;
        }
        // сохраняем согласие в браузере
        localStorage.setItem('consentGiven', 'true');

            if (cart.length === 0) { document.getElementById('status').innerText = '❌ Выберите товар'; return; }
            if (!address) { document.getElementById('status').innerText = '❌ Введите адрес'; return; }
            if (!phone) { document.getElementById('status').innerText = '❌ Введите телефон'; return; }

            let totalWeight = 0;
            cart.forEach(item => totalWeight += item.weight);
            if (totalWeight > 20) {
                document.getElementById('status').innerText = `❌ Суммарный вес (${totalWeight.toFixed(1)} кг) превышает 20 кг. Уберите лишние товары.`;
                return;
            }

            const grouped = {};
            cart.forEach(item => {
                if (!grouped[item.shop]) grouped[item.shop] = [];
                grouped[item.shop].push(item.name);
            });

            let allOk = true;
            for (const shop in grouped) {
                const payload = {
                    user_id: userId,
                    username: 'vk_user',
                    shop: shop,
                    item: grouped[shop].join(', '),
                    address: address,
                    phone: phone,
                    comment: comment,
                    source: 'vk'
                };
                try {
                    const response = await fetch(`${API_BASE}/api/vk_order`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    if (!response.ok || result.status === 'error') {
                        allOk = false;
                        document.getElementById('status').innerText = `❌ ${result.message || 'Ошибка'}`;
                        if (result.message && result.message.includes('превышает 20 кг')) {
                            alert(result.message);
                        }
                        break;
                    }
                } catch (e) {
                    allOk = false;
                    document.getElementById('status').innerText = '❌ Ошибка соединения';
                    break;
                }
            }

            if (allOk) {
                document.getElementById('status').innerText = '✅ Все заказы оформлены!';
                cart = [];
                updateCartDisplay();
                document.getElementById('address').value = '';
                document.getElementById('phone').value = '';
                document.getElementById('order-comment').value = '';
                getOrders();
            }
        }

        async function checkStatus() {
            try {
                const res = await fetch(`${API_BASE}/api/order_status/${userId}`);
                const data = await res.json();
                document.getElementById('status').innerText = `📦 Статус последнего заказа: ${data.status}`;
            } catch (e) {
                document.getElementById('status').innerText = '❌ Ошибка получения статуса';
            }
        }

        function refreshOrders() {
            document.getElementById('status').innerText = '🔄 Обновление...';
            getOrders();
        }

        async function getOrders() {
            const list = document.getElementById('orders-list');
            try {
                const res = await fetch(`${API_BASE}/api/user_orders/${userId}`);
                const data = await res.json();
                list.classList.remove('hidden');
                if (data.orders && data.orders.length > 0) {
                    const active = data.orders.filter(o => o.status !== '✅ Доставлен' && o.status !== '❌ Отменён');
                    const completed = data.orders.filter(o => o.status === '✅ Доставлен' || o.status === '❌ Отменён');
                    let html = '';
                    if (active.length > 0) {
                        html += `<div class="active-section"><b>🟡 Активные заказы (${active.length}):</b><br>`;
                        active.forEach((o, i) => {
                            const items = formatOrderItems(o.item);
                            const weight = o.total_weight || 0;
                            html += `<div class="order-item">${i+1}. ${items} (${o.shop || 'магазин'}) — ${o.status || '🟡 Ожидает'} | Вес: ${weight} кг</div>`;
                        });
                        html += `</div>`;
                    }
                    if (completed.length > 0) {
                        html += `<div class="completed-section"><b>✅ Завершённые (${completed.length}):</b><br>`;
                        completed.forEach((o, i) => {
                            const items = formatOrderItems(o.item);
                            const rating = o.rating || '⭐️ Не оценён';
                            const weight = o.total_weight || 0;
                            html += `<div class="order-item">${i+1}. ${items} (${o.shop || 'магазин'}) — ${o.status || '✅ Доставлен'} | ${rating} | Вес: ${weight} кг</div>`;
                        });
                        html += `</div>`;
                    }
                    list.innerHTML = html || '<div class="empty-msg">У вас пока нет заказов</div>';
                } else {
                    list.innerHTML = '<div class="empty-msg">У вас пока нет заказов</div>';
                }
            } catch (e) {
                list.innerHTML = '<div class="empty-msg">❌ Ошибка загрузки заказов</div>';
            }
        }

        function formatOrderItems(itemText) {
            if (!itemText) return '';
            let items = [];
            if (itemText.includes('\n')) {
                items = itemText.split('\n').filter(s => s.trim());
            } else {
                items = itemText.split(',').map(s => s.trim()).filter(s => s);
            }
            items = items.map(s => s.replace(/[•🛒Корзина:]/g, '').trim()).filter(s => s);

            // Извлекаем названия (убираем цену)
            const names = items.map(item => {
                const match = item.match(/^(.*?)\s*[—\-]/);
                return match ? match[1].trim() : item;
            });

            const grouped = {};
            names.forEach(name => {
                if (!name) return;
                if (!grouped[name]) grouped[name] = 0;
                grouped[name] += 1;
            });

            let result = [];
            for (const name in grouped) {
                if (grouped[name] > 1) {
                    result.push(`${name} x${grouped[name]}`);
                } else {
                    result.push(name);
                }
            }
            return result.join(', ');
        }

        function showSupport() {
            document.getElementById('support-form').classList.remove('hidden');
        }

        function hideSupport() {
            document.getElementById('support-form').classList.add('hidden');
        }

        async function sendSupport() {
            const msg = document.getElementById('support-message').value;
            if (!msg) { alert('Напишите сообщение'); return; }
            try {
                await fetch(`${API_BASE}/api/support`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, username: 'vk_user', message: msg })
                });
                document.getElementById('support-message').value = '';
                hideSupport();
                document.getElementById('status').innerText = '✅ Сообщение отправлено в поддержку!';
            } catch (e) {
                document.getElementById('status').innerText = '❌ Ошибка отправки';
            }
        }

        if (typeof vkBridge !== 'undefined') {
            vkBridge.send('VKWebAppInit', {})
                .then(() => {
                    console.log('✅ VKAppInit OK');
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');
                    loadShops();
                    getOrders();
                })
                .catch(e => console.error('❌ Init error', e));
        }
    </script>
    <!-- Политика конфиденциальности -->
    <div style="text-align:center; padding:16px 0 20px 0; font-size:12px; color:#888;">
        <a href="https://s86849730-png.github.io/vk-delivery-app/privacy.html" 
           target="_blank" 
           style="color:#667eea; text-decoration:none;">
            Политика конфиденциальности
        </a>
    </div>
</body>
</html>
