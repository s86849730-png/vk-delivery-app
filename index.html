<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoSHtavKa — Доставка</title>
    <script src="https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@latest/dist/browser.min.js"></script>
    <style>
        /* стили как раньше, не меняем */
    </style>
</head>
<body>
    <div id="loading" class="loading">⏳ Загрузка...</div>
    <div id="app" class="container hidden">
        <h1>🚀 DoSHtavKa</h1>
        <p style="text-align:center; color:#555;">Доставка из Бородино</p>
        <div id="menu"></div>
        <div class="cart">
            <h3>🛒 Корзина</h3>
            <div id="cart-items">Товаров: 0</div>
            <div id="cart-details" class="cart-items-detail"></div>
            <div id="cart-total" class="cart-total">💰 Итого: 0 ₽</div>
            <div id="delivery-fee" class="delivery-fee">🚚 Доставка: 150 ₽</div>
            <div id="weight-display" class="weight-warning" style="display:none;"></div>
            <input type="text" id="address" placeholder="📍 Адрес доставки">
            <input type="tel" id="phone" placeholder="📞 Телефон для связи">
            <textarea id="order-comment" rows="2" placeholder="📝 Комментарий к заказу (необязательно)"></textarea>
            <button onclick="sendOrder()">✅ Оформить заказ</button>
            <button onclick="checkStatus()" class="btn-secondary">📋 Узнать статус последнего заказа</button>
            <button onclick="getOrders()" class="btn-orders">📋 Мои заказы</button>
            <button onclick="refreshOrders()" class="btn-refresh">🔄 Обновить</button>
            <button onclick="showSupport()" class="btn-support">🆘 Поддержка</button>
            <div id="status" class="status-text"></div>
            <div id="support-form" class="support-form hidden">
                <textarea id="support-message" rows="3" placeholder="Опишите вашу проблему..."></textarea>
                <button onclick="sendSupport()">📤 Отправить</button>
                <button onclick="hideSupport()" class="btn-secondary">❌ Отмена</button>
            </div>
            <div id="orders-list" class="orders-list hidden"><div class="empty-msg">Нажмите «Мои заказы», чтобы увидеть список</div></div>
        </div>
    </div>
    <script>
        const API_BASE = 'https://accessory-pound-ada-produced.trycloudflare.com';
        let cart = [];
        let userId = 123456789;
        let shopsData = null;

        async function loadShops() {
            // ... (как раньше)
        }

        function addToCart(shop, item, weight) {
            cart.push({ shop, name: item, weight: weight || 0 });
            updateCartDisplay();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartDisplay();
        }

        function updateCartDisplay() {
            // ... (как раньше)
        }

        function formatOrderItems(itemText) {
            if (!itemText) return '';
            let items = [];
            if (itemText.includes('\n')) {
                items = itemText.split('\n').filter(s => s.trim());
            } else {
                items = itemText.split(',').map(s => s.trim()).filter(s => s);
            }
            items = items.map(s => s.replace(/[•🛒Корзина:]/g, '').trim()).filter(s => s);
            const grouped = {};
            items.forEach(item => {
                const clean = item.replace(/— \d+.*/, '').trim();
                if (!clean) return;
                if (!grouped[clean]) grouped[clean] = 0;
                grouped[clean] += 1;
            });
            let result = [];
            for (const name in grouped) {
                if (grouped[name] > 1) {
                    result.push(`${name} x${grouped[name]}`);
                } else {
                    result.push(name);
                }
            }
            return result.join(', ');
        }

        async function sendOrder() {
            // ... (с проверкой веса и отправкой)
        }

        async function checkStatus() {
            // ...
        }

        function refreshOrders() {
            getOrders();
        }

        async function getOrders() {
            const list = document.getElementById('orders-list');
            try {
                const res = await fetch(`${API_BASE}/api/user_orders/${userId}`);
                const data = await res.json();
                list.classList.remove('hidden');
                if (data.orders && data.orders.length > 0) {
                    const active = data.orders.filter(o => o.status !== '✅ Доставлен' && o.status !== '❌ Отменён');
                    const completed = data.orders.filter(o => o.status === '✅ Доставлен' || o.status === '❌ Отменён');
                    let html = '';
                    if (active.length > 0) {
                        html += `<div class="active-section"><b>🟡 Активные заказы (${active.length}):</b><br>`;
                        active.forEach((o, i) => {
                            const items = formatOrderItems(o.item);
                            const weight = o.total_weight || 0;
                            html += `<div class="order-item">${i+1}. ${items} (${o.shop || 'магазин'}) — ${o.status || '🟡 Ожидает'} | Вес: ${weight} кг</div>`;
                        });
                        html += `</div>`;
                    }
                    if (completed.length > 0) {
                        html += `<div class="completed-section"><b>✅ Завершённые (${completed.length}):</b><br>`;
                        completed.forEach((o, i) => {
                            const items = formatOrderItems(o.item);
                            const rating = o.rating || '⭐️ Не оценён';
                            const comment = o.rating_comment ? ` 📝 ${o.rating_comment}` : '';
                            const weight = o.total_weight || 0;
                            html += `<div class="order-item">${i+1}. ${items} (${o.shop || 'магазин'}) — ${o.status || '✅ Доставлен'} | ${rating}${comment} | Вес: ${weight} кг`;
                            if (o.status === '✅ Доставлен' && (!o.rating || o.rating === '⭐️ Не оценён')) {
                                html += ` <button onclick="rateOrder('${o.order_id}')" style="background:#f1c40f; border:none; padding:2px 8px; border-radius:4px; cursor:pointer;">⭐️ Оценить</button>`;
                            }
                            html += `</div>`;
                        });
                        html += `</div>`;
                    }
                    list.innerHTML = html || '<div class="empty-msg">У вас пока нет заказов</div>';
                } else {
                    list.innerHTML = '<div class="empty-msg">У вас пока нет заказов</div>';
                }
            } catch (e) {
                list.innerHTML = '<div class="empty-msg">❌ Ошибка загрузки заказов</div>';
            }
        }

        async function rateOrder(orderId) {
            const rating = prompt('Оцените заказ от 1 до 5:', '5');
            if (!rating || rating < 1 || rating > 5) {
                alert('Пожалуйста, введите число от 1 до 5');
                return;
            }
            const comment = prompt('Оставьте комментарий (необязательно):', '');
            try {
                const response = await fetch(`${API_BASE}/api/rate_order/${orderId}/${rating}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ comment: comment || '' })
                });
                if (response.ok) {
                    getOrders();
                    document.getElementById('status').innerText = '✅ Оценка сохранена!';
                } else {
                    alert('Ошибка при сохранении оценки');
                }
            } catch (e) {
                alert('Ошибка отправки оценки');
            }
        }

        function showSupport() {
            document.getElementById('support-form').classList.remove('hidden');
        }

        function hideSupport() {
            document.getElementById('support-form').classList.add('hidden');
        }

        async function sendSupport() {
            const msg = document.getElementById('support-message').value;
            if (!msg) { alert('Напишите сообщение'); return; }
            try {
                await fetch(`${API_BASE}/api/support`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, username: 'vk_user', message: msg })
                });
                document.getElementById('support-message').value = '';
                hideSupport();
                document.getElementById('status').innerText = '✅ Сообщение отправлено в поддержку!';
            } catch (e) {
                document.getElementById('status').innerText = '❌ Ошибка отправки';
            }
        }

        if (typeof vkBridge !== 'undefined') {
            vkBridge.send('VKWebAppInit', {})
                .then(() => {
                    console.log('✅ VKAppInit OK');
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');
                    loadShops();
                    getOrders();
                })
                .catch(e => console.error('❌ Init error', e));
        }
    </script>
</body>
</html>
