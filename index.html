<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoSHtavKa — Доставка</title>
    <script src="https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@latest/dist/browser.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 16px; background: #f5f7fa; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        h1 { text-align: center; color: #333; }
        .menu-item {
            background: white;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-item button {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .cart {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .cart input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .cart button {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .cart .btn-secondary {
            background: #6c5ce7;
            margin-top: 8px;
        }
        .cart .btn-orders {
            background: #e17055;
            margin-top: 8px;
        }
        .cart .btn-support {
            background: #fdcb6e;
            margin-top: 8px;
            color: #333;
        }
        .status-text { text-align: center; margin-top: 10px; font-size: 14px; color: #555; }
        .loading { text-align: center; font-size: 18px; padding: 40px; color: #888; }
        .hidden { display: none; }
        .orders-list {
            margin-top: 10px;
            font-size: 14px;
            color: #333;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
        }
        .orders-list .order-item { padding: 6px 0; border-bottom: 1px solid #eee; }
        .orders-list .order-item:last-child { border-bottom: none; }
        .orders-list .active-section { border-left: 3px solid #fdcb6e; padding-left: 10px; margin-bottom: 8px; }
        .orders-list .completed-section { border-left: 3px solid #00b894; padding-left: 10px; }
        .orders-list .empty-msg { color: #888; text-align: center; padding: 12px 0; }
        .cart-items-detail { font-size: 14px; color: #555; margin: 6px 0; }
        .cart-items-detail .shop-name { font-weight: bold; color: #333; }
        .rating-buttons { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .rating-buttons button { background: #f1c40f; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .rating-buttons button:hover { background: #f39c12; }
        .support-form { margin-top: 10px; }
        .support-form textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; box-sizing: border-box; }
        .support-form button { margin-top: 8px; }
    </style>
</head>
<body>
    <div id="loading" class="loading">⏳ Загрузка...</div>
    <div id="app" class="container hidden">
        <h1>🚀 DoSHtavKa</h1>
        <p style="text-align:center; color:#555;">Доставка из Бородино</p>
        <div id="menu"></div>
        <div class="cart">
            <h3>🛒 Корзина</h3>
            <div id="cart-items">Товаров: 0</div>
            <div id="cart-details" class="cart-items-detail"></div>
            <div id="cart-total" style="font-weight:bold; margin-top:8px; color:#333;">💰 Итого: 0 ₽</div>
            <input type="text" id="address" placeholder="📍 Адрес доставки">
            <input type="tel" id="phone" placeholder="📞 Телефон для связи">
            <button onclick="sendOrder()">✅ Оформить заказ</button>
            <button onclick="checkStatus()" class="btn-secondary">📋 Узнать статус последнего заказа</button>
            <button onclick="getOrders()" class="btn-orders">📋 Мои заказы</button>
            <button onclick="showSupport()" class="btn-support">🆘 Поддержка</button>
            <div id="status" class="status-text"></div>
            <div id="support-form" class="support-form hidden">
                <textarea id="support-message" rows="3" placeholder="Опишите вашу проблему..."></textarea>
                <button onclick="sendSupport()">📤 Отправить</button>
                <button onclick="hideSupport()" class="btn-secondary">❌ Отмена</button>
            </div>
            <div id="orders-list" class="orders-list hidden"><div class="empty-msg">Нажмите «Мои заказы», чтобы увидеть список</div></div>
        </div>
    </div>
    <script>
        const API_BASE = 'https://accessory-pound-ada-produced.trycloudflare.com';
        let cart = []; // { shop: "Пиццерия", name: "Маргарита — 450₽" }
        let userId = 123456789;

        async function loadShops() {
            try {
                const res = await fetch(`${API_BASE}/api/shops`);
                const data = await res.json();
                const menu = document.getElementById('menu');
                menu.innerHTML = '';
                if (data.shops && data.shops.length > 0) {
                    data.shops.forEach(shop => {
                        const shopTitle = document.createElement('div');
                        shopTitle.style.cssText = 'font-weight:bold; margin:12px 0 6px; color:#333;';
                        shopTitle.innerText = '🏪 ' + shop.name;
                        menu.appendChild(shopTitle);
                        shop.items.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'menu-item';
                            div.innerHTML = `
                                <span>${item.name} — ${item.price}</span>
                                <button onclick="addToCart('${shop.name}', '${item.name} — ${item.price}')">+</button>
                            `;
                            menu.appendChild(div);
                        });
                    });
                } else {
                    menu.innerHTML = '<p style="text-align:center;color:#888;">Меню пока пусто. Загляните позже!</p>';
                }
            } catch (e) {
                document.getElementById('menu').innerHTML = '<p style="text-align:center;color:#e74c3c;">❌ Ошибка загрузки меню</p>';
            }
        }

        function addToCart(shop, item) {
            cart.push({ shop, name: item });
            updateCartDisplay();
        }

        function updateCartDisplay() {
	    document.getElementById('cart-items').innerText = 'Товаров: ' + cart.length;
	    const details = document.getElementById('cart-details');
	    const totalElem = document.getElementById('cart-total');
	    
	    if (cart.length === 0) {
	        details.innerHTML = '';
	        if (totalElem) totalElem.innerText = '💰 Итого: 0 ₽';
	        return;
	    }
	    
	    // Группируем товары и считаем сумму
	    const grouped = {};
	    let total = 0;
	    cart.forEach(item => {
	        // Извлекаем цену из названия (например, "Хлеб — 30 руб" → 30)
	        const priceMatch = item.name.match(/(\d+)/);
	        const price = priceMatch ? parseInt(priceMatch[0]) : 0;
	        total += price;
	        
	        const key = item.shop + '|||' + item.name;
	        if (!grouped[key]) {
	            grouped[key] = {
	                shop: item.shop,
	                name: item.name,
	                count: 0,
	                price: price
	            };
	        }
	        grouped[key].count += 1;
	    });
	    
	    let html = '';
	    for (const key in grouped) {
	        const item = grouped[key];
	        const subtotal = item.price * item.count;
	        html += `<div><span class="shop-name">${item.shop}</span>: ${item.name} x${item.count} = ${subtotal} ₽</div>`;
	    }
	    details.innerHTML = html;
	    if (totalElem) totalElem.innerText = `💰 Итого: ${total} ₽`;
	}

        async function sendOrder() {
            const address = document.getElementById('address').value;
            const phone = document.getElementById('phone').value;
            if (cart.length === 0) { document.getElementById('status').innerText = '❌ Выберите товар'; return; }
            if (!address) { document.getElementById('status').innerText = '❌ Введите адрес'; return; }
            if (!phone) { document.getElementById('status').innerText = '❌ Введите телефон'; return; }

            const grouped = {};
            cart.forEach(item => {
                if (!grouped[item.shop]) grouped[item.shop] = [];
                grouped[item.shop].push(item.name);
            });

            let allOk = true;
            for (const shop in grouped) {
                const payload = {
                    user_id: userId,
                    username: 'vk_user',
                    shop: shop,
                    item: grouped[shop].join(', '),
                    address: address,
                    phone: phone,
                    source: 'vk'
                };
                try {
                    const response = await fetch(`${API_BASE}/api/vk_order`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) allOk = false;
                } catch (e) {
                    allOk = false;
                }
            }

            if (allOk) {
                document.getElementById('status').innerText = '✅ Все заказы оформлены!';
                cart = [];
                updateCartDisplay();
                document.getElementById('address').value = '';
                document.getElementById('phone').value = '';
                getOrders();
            } else {
                document.getElementById('status').innerText = '❌ Ошибка при оформлении одного из заказов';
            }
        }

        async function checkStatus() {
            try {
                const res = await fetch(`${API_BASE}/api/order_status/${userId}`);
                const data = await res.json();
                document.getElementById('status').innerText = `📦 Статус последнего заказа: ${data.status}`;
            } catch (e) {
                document.getElementById('status').innerText = '❌ Ошибка получения статуса';
            }
        }

        async function getOrders() {
            const list = document.getElementById('orders-list');
            try {
                const res = await fetch(`${API_BASE}/api/user_orders/${userId}`);
                const data = await res.json();
                list.classList.remove('hidden');
                if (data.orders && data.orders.length > 0) {
                    const active = data.orders.filter(o => o.status !== '✅ Доставлен' && o.status !== '❌ Отменён');
                    const completed = data.orders.filter(o => o.status === '✅ Доставлен' || o.status === '❌ Отменён');
                    let html = '';
                    if (active.length > 0) {
                        html += `<div class="active-section"><b>🟡 Активные заказы (${active.length}):</b><br>`;
                        active.forEach((o, i) => {
                            html += `<div class="order-item">${i+1}. ${o.item} (${o.shop || 'магазин'}) — ${o.status || '🟡 Ожидает'}</div>`;
                        });
                        html += `</div>`;
                    }
                    if (completed.length > 0) {
                        html += `<div class="completed-section"><b>✅ Завершённые (${completed.length}):</b><br>`;
                        completed.forEach((o, i) => {
                            const rating = o.rating || '⭐️ Не оценён';
                            html += `<div class="order-item">${i+1}. ${o.item} (${o.shop || 'магазин'}) — ${o.status || '✅ Доставлен'} | ${rating}`;
                            if (o.status === '✅ Доставлен' && (!o.rating || o.rating === '⭐️ Не оценён')) {
                                html += ` <button onclick="rateOrder(${data.orders.length - 1 - i})" style="background:#f1c40f; border:none; padding:2px 8px; border-radius:4px; cursor:pointer;">⭐️ Оценить</button>`;
                            }
                            html += `</div>`;
                        });
                        html += `</div>`;
                    }
                    list.innerHTML = html || '<div class="empty-msg">У вас пока нет заказов</div>';
                } else {
                    list.innerHTML = '<div class="empty-msg">У вас пока нет заказов</div>';
                }
            } catch (e) {
                list.innerHTML = '<div class="empty-msg">❌ Ошибка загрузки заказов</div>';
            }
        }

        async function rateOrder(orderIndex) {
            const rating = prompt('Оцените заказ от 1 до 5:', '5');
            if (!rating || rating < 1 || rating > 5) {
                alert('Пожалуйста, введите число от 1 до 5');
                return;
            }
            try {
                await fetch(`${API_BASE}/api/rate_order/${orderIndex}/${rating}`, { method: 'POST' });
                getOrders();
            } catch (e) {
                alert('Ошибка отправки оценки');
            }
        }

        function showSupport() {
            document.getElementById('support-form').classList.remove('hidden');
        }

        function hideSupport() {
            document.getElementById('support-form').classList.add('hidden');
        }

        async function sendSupport() {
            const msg = document.getElementById('support-message').value;
            if (!msg) { alert('Напишите сообщение'); return; }
            try {
                await fetch(`${API_BASE}/api/support`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, message: msg })
                });
                document.getElementById('support-message').value = '';
                hideSupport();
                document.getElementById('status').innerText = '✅ Сообщение отправлено в поддержку!';
            } catch (e) {
                document.getElementById('status').innerText = '❌ Ошибка отправки';
            }
        }

        if (typeof vkBridge !== 'undefined') {
            vkBridge.send('VKWebAppInit', {})
                .then(() => {
                    console.log('✅ VKAppInit OK');
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');
                    loadShops();
                    getOrders();
                })
                .catch(e => console.error('❌ Init error', e));
        }
    </script>
</body>
</html>
